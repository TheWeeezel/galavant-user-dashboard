[build]
  command = "npm ci && npm run build"
  publish = "dist"

# VITE_API_URL steht hier BEWUSST NICHT.
#
# Die Reihenfolge bei Netlify ist: netlify.toml schlaegt die Oberflaeche, die Oberflaeche
# schlaegt .env-Dateien. Ein Eintrag hier waere also nicht die zusaetzliche Absicherung,
# als die er aussieht, sondern das Gegenteil: er nimmt der Oberflaeche die Wirkung.
#
# Genau die brauchen wir aber als Notausstieg. Der Serverwechsel auf ap1.galavant.run
# steht als Rueckfallwert in src/config.ts, sichtbar im Diff und im Review. Muss die
# Webseite im Stoerfall kurzfristig zurueck auf Cloud Run, ist das dann ein Eintrag in
# der Netlify-Oberflaeche plus ein Deploy — dreissig Sekunden, ohne Commit. Steht die
# Variable hier, wird dieser Eintrag stillschweigend ignoriert, es gibt keine
# Fehlermeldung, und man sucht den Fehler ueberall ausser an der richtigen Stelle.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "unsafe-none"
    # GAL-SEC-007 (2026-09-30): REPORT-ONLY. Blocks nothing; violations go to the API's /csp-report
    # log. Flip to Content-Security-Policy once that log stays quiet on real sign-ins. The sha256
    # is the day/night theme script inline in index.html — change that script, recompute the hash.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client 'sha256-9WjEI6fCcvt1oI2K73eddVkU5HyL2HZaeV9h8KtGZiw='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://ap1.galavant.run https://*.googleusercontent.com; connect-src 'self' https://ap1.galavant.run https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri https://ap1.galavant.run/csp-report"

# The admin dashboard (separate origin) reads this to generate per-release tweets.
# It is public data anyway, so any origin may GET it.
[[headers]]
  for = "/changelog.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
