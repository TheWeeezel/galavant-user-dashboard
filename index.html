<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galavant — Move to Earn on Enjin</title>
    <meta name="description" content="Galavant is a move-to-earn cycling game on the Enjin blockchain. Walk with balance bikes outdoors to earn WATTS and collect NFT bikes." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-m2e-bg text-m2e-text antialiased">
    <div id="root"></div>
    <script>
      // Sky clock: the site follows the visitor's local time — night from
      // 20:00 to 05:00. Set before first paint so there is no theme flash.
      (function () {
        var night = false;
        try {
          var h = new Date().getHours();
          night = h >= 20 || h < 5;
        } catch (e) {}
        document.documentElement.dataset.theme = night ? 'night' : 'day';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
